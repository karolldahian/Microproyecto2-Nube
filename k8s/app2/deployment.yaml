apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  labels:
    app: app2
    app.kubernetes.io/name: app2
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: microproyecto2-nube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
        app.kubernetes.io/name: app2
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: microproyecto2-nube
    spec:
      containers:
        - name: app2
          image: ghcr.io/karolldahian/microproyecto2-app2:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3