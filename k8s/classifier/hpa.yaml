apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: classifier
  labels:
    app: classifier
    app.kubernetes.io/name: classifier
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: microproyecto2-nube
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: classifier
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60