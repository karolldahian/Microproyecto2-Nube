apiVersion: apps/v1
kind: Deployment
metadata:
  name: classifier
  labels:
    app: classifier
    app.kubernetes.io/name: classifier
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: microproyecto2-nube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: classifier
  template:
    metadata:
      labels:
        app: classifier
        app.kubernetes.io/name: classifier
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: microproyecto2-nube
    spec:
      containers:
        - name: classifier
          image: ghcr.io/karolldahian/microproyecto2-classifier:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
